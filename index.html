<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Воксельная игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #87CEEB;
            cursor: crosshair;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            mix-blend-mode: difference;
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 9px;
        }

        #hud {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 8px;
            z-index: 100;
        }

        .hotbar-slot {
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hotbar-slot.active {
            border-color: white;
            background: rgba(255, 255, 255, 0.2);
        }

        #instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 100;
            text-align: center;
            font-size: 14px;
        }

        #blockMenu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 12px;
            z-index: 1000;
            display: none;
        }

        #blockMenu.active {
            display: block;
        }

        .block-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .block-option {
            width: 64px;
            height: 64px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            transition: all 0.2s;
        }

        .block-option:hover {
            border-color: white;
            background: #444;
        }
    </style>
</head>
<body>
    <div id="gameCanvas"></div>
    
    <div id="crosshair"></div>
    
    <div id="instructions">
        WASD - движение | Пробел - прыжок | ЛКМ - сломать блок | ПКМ - поставить блок | E - меню блоков | ESC - пауза
    </div>

    <div id="hud">
        <div class="hotbar-slot active" data-block="grass">🌿</div>
        <div class="hotbar-slot" data-block="dirt">🟫</div>
        <div class="hotbar-slot" data-block="stone">🪨</div>
        <div class="hotbar-slot" data-block="wood">🪵</div>
        <div class="hotbar-slot" data-block="leaves">🍃</div>
        <div class="hotbar-slot" data-block="sand">🏖️</div>
        <div class="hotbar-slot" data-block="glass">🔲</div>
        <div class="hotbar-slot" data-block="brick">🧱</div>
    </div>

    <div id="blockMenu">
        <h2 style="color: white; text-align: center; margin-bottom: 12px;">Выберите блок</h2>
        <div class="block-grid" id="blockGrid"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

        // Камера
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 30);

        // Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('gameCanvas').appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add(directionalLight);

        // Игровые переменные
        const blocks = new Map();
        const blockSize = 2;
        let selectedBlock = 'grass';
        let isPaused = false;
        let mouseX = 0, mouseY = 0;
        let yaw = 0, pitch = 0;
        const velocity = new THREE.Vector3();
        const playerPos = new THREE.Vector3(0, 20, 30);

        // Цвета блоков
        const blockColors = {
            grass: 0x7cb342,
            dirt: 0x8d6e63,
            stone: 0x9e9e9e,
            wood: 0x6d4c41,
            leaves: 0x4caf50,
            sand: 0xfdd835,
            glass: 0x90caf9,
            brick: 0xe57373
        };

        // Создание блока
        function createBlock(type, x, y, z) {
            const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
            const material = new THREE.MeshStandardMaterial({
                color: blockColors[type] || 0xffffff,
                roughness: 0.7,
                metalness: 0.1,
                transparent: type === 'glass',
                opacity: type === 'glass' ? 0.5 : 1
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { type: type, x: x, y: y, z: z };
            
            scene.add(mesh);
            blocks.set(`${x},${y},${z}`, mesh);
            
            return mesh;
        }

        // Удаление блока
        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            const mesh = blocks.get(key);
            if (mesh) {
                scene.remove(mesh);
                blocks.delete(key);
            }
        }

        // Генерация мира
        function generateWorld() {
            // Земля
            for (let x = -20; x <= 20; x++) {
                for (let z = -20; z <= 20; z++) {
                    createBlock('grass', x * blockSize, 0, z * blockSize);
                    createBlock('dirt', x * blockSize, -blockSize, z * blockSize);
                    createBlock('stone', x * blockSize, -blockSize * 2, z * blockSize);
                }
            }

            // Деревья
            for (let i = 0; i < 10; i++) {
                const treeX = (Math.random() - 0.5) * 30;
                const treeZ = (Math.random() - 0.5) * 30;
                const treeHeight = Math.floor(Math.random() * 3) + 3;
                
                for (let y = 1; y <= treeHeight; y++) {
                    createBlock('wood', Math.round(treeX) * blockSize, y * blockSize, Math.round(treeZ) * blockSize);
                }
                
                // Листья
                for (let dx = -2; dx <= 2; dx++) {
                    for (let dy = -2; dy <= 2; dy++) {
                        for (let dz = -2; dz <= 2; dz++) {
                            if (Math.abs(dx) + Math.abs(dy) + Math.abs(dz) <= 4) {
                                createBlock('leaves', 
                                    Math.round(treeX) * blockSize + dx * blockSize,
                                    (treeHeight + dy) * blockSize,
                                    Math.round(treeZ) * blockSize + dz * blockSize
                                );
                            }
                        }
                    }
                }
            }
        }

        // Рейкаст для определения блока под курсором
        function raycaster() {
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            
            for (let i = 0; i < 10; i += 0.1) {
                const checkPos = camera.position.clone().add(
                    direction.clone().multiplyScalar(i)
                );
                
                const blockX = Math.round(checkPos.x / blockSize) * blockSize;
                const blockY = Math.round(checkPos.y / blockSize) * blockSize;
                const blockZ = Math.round(checkPos.z / blockSize) * blockSize;
                
                const key = `${blockX},${blockY},${blockZ}`;
                if (blocks.has(key)) {
                    return {
                        block: blocks.get(key),
                        position: new THREE.Vector3(blockX, blockY, blockZ),
                        distance: i
                    };
                }
            }
            return null;
        }

        // Обработка кликов
        function handleClick(event) {
            if (isPaused) return;
            
            const hit = raycaster();
            if (!hit) return;
            
            if (event.button === 0) { // Левая кнопка - сломать
                removeBlock(hit.position.x, hit.position.y, hit.position.z);
            } else if (event.button === 2) { // Правая кнопка - поставить
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                
                const placePos = hit.position.clone().sub(
                    direction.clone().multiplyScalar(0.5)
                );
                
                const blockX = Math.round(placePos.x / blockSize) * blockSize;
                const blockY = Math.round(placePos.y / blockSize) * blockSize;
                const blockZ = Math.round(placePos.z / blockSize) * blockSize;
                
                const key = `${blockX},${blockY},${blockZ}`;
                if (!blocks.has(key)) {
                    createBlock(selectedBlock, blockX, blockY, blockZ);
                }
            }
        }

        // Обновление камеры
        function updateCamera() {
            camera.position.copy(playerPos);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        // Движение
        function updateMovement(deltaTime) {
            if (isPaused) return;
            
            const speed = 15;
            const direction = new THREE.Vector3();
            
            if (keys['KeyW']) direction.z -= 1;
            if (keys['KeyS']) direction.z += 1;
            if (keys['KeyA']) direction.x -= 1;
            if (keys['KeyD']) direction.x += 1;
            
            direction.normalize();
            
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
            
            const movement = new THREE.Vector3();
            movement.add(forward.multiplyScalar(direction.z));
            movement.add(right.multiplyScalar(direction.x));
            
            playerPos.add(movement.multiplyScalar(speed * deltaTime));
            
            // Гравитация
            velocity.y -= 30 * deltaTime;
            playerPos.y += velocity.y * deltaTime;
            
            // Проверка столкновений с землей
            const groundLevel = blockSize * 0.5;
            if (playerPos.y < groundLevel + 1) {
                playerPos.y = groundLevel + 1;
                velocity.y = 0;
                
                if (keys['Space']) {
                    velocity.y = 12;
                }
            }
        }

        // Управление
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (e.code === 'KeyE') {
                document.getElementById('blockMenu').classList.toggle('active');
                isPaused = !isPaused;
            }
            
            if (e.code === 'Escape') {
                isPaused = !isPaused;
                document.getElementById('blockMenu').classList.remove('active');
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Мышь
        document.addEventListener('mousemove', (e) => {
            if (isPaused) return;
            
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            
            updateCamera();
        });

        document.addEventListener('mousedown', handleClick);
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // Блокировка курсора
        renderer.domElement.addEventListener('click', () => {
            if (!isPaused) {
                renderer.domElement.requestPointerLock();
            }
        });

        // Выбор блока
        function selectBlock(type) {
            selectedBlock = type;
            document.querySelectorAll('.hotbar-slot').forEach(slot => {
                slot.classList.toggle('active', slot.dataset.block === type);
            });
            document.getElementById('blockMenu').classList.remove('active');
            isPaused = false;
        }

        // Инициализация HUD
        document.querySelectorAll('.hotbar-slot').forEach(slot => {
            slot.addEventListener('click', () => selectBlock(slot.dataset.block));
        });

        // Меню блоков
        const blockGrid = document.getElementById('blockGrid');
        const blockTypes = ['grass', 'dirt', 'stone', 'wood', 'leaves', 'sand', 'glass', 'brick'];
        const blockEmojis = { grass: '🌿', dirt: '🟫', stone: '🪨', wood: '🪵', leaves: '🍃', sand: '🏖️', glass: '🔲', brick: '🧱' };
        
        blockTypes.forEach(type => {
            const blockOption = document.createElement('div');
            blockOption.className = 'block-option';
            blockOption.textContent = blockEmojis[type];
            blockOption.onclick = () => selectBlock(type);
            blockGrid.appendChild(blockOption);
        });

        // Цифровые клавиши для выбора блока
        document.addEventListener('keydown', (e) => {
            const num = parseInt(e.key);
            if (num >= 1 && num <= 8) {
                selectBlock(blockTypes[num - 1]);
            }
        });

        // Анимация
        let lastTime = performance.now();
        
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            updateMovement(deltaTime);
            updateCamera();
            
            renderer.render(scene, camera);
        }

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск игры
        generateWorld();
        updateCamera();
        animate(performance.now());
    </script>
</body>
            </html>
