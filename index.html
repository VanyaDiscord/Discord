<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гиомитридеш</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            background: #2c3e50;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        canvas {
            border: 4px solid #34495e;
            border-radius: 10px;
            display: block;
        }
        
        #score {
            color: white;
            font-size: 24px;
            text-align: center;
            margin-top: 10px;
        }
        
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        
        .restart-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .restart-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="score">Счёт: 0</div>
    </div>
    
    <div id="gameOver">
        <h2>Игра окончена!</h2>
        <p>Ваш счёт: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">Играть снова</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Игровые переменные
        let gameRunning = true;
        let score = 0;
        let speed = 5;
        let gravity = 0.5;
        
        // Куб (игрок)
        const player = {
            x: 100,
            y: 300,
            width: 40,
            height: 40,
            vy: 0,
            rotation: 0,
            color: '#00ff00',
            isJumping: false
        };
        
        // Препятствия
        let obstacles = [];
        
        // Функция создания препятствий
        function createObstacle() {
            const height = Math.random() * 100 + 30;
            obstacles.push({
                x: canvas.width,
                y: canvas.height - height,
                width: 30,
                height: height,
                color: '#ff4444'
            });
        }
        
        // Обработка прыжка
        function jump() {
            if (!player.isJumping && gameRunning) {
                player.vy = -12;
                player.isJumping = true;
                player.rotation = -45;
            }
        }
        
        // Обработчики событий
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'ArrowUp') {
                jump();
            }
        });
        
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        
        // Обновление игры
        function update() {
            if (!gameRunning) return;
            
            // Гравитация
            player.vy += gravity;
            player.y += player.vy;
            
            // Вращение куба
            if (player.isJumping) {
                player.rotation += 5;
                if (player.rotation > 360) player.rotation = 0;
            }
            
            // Проверка на касание земли
            if (player.y > canvas.height - player.height) {
                player.y = canvas.height - player.height;
                player.vy = 0;
                player.isJumping = false;
                player.rotation = 0;
            }
            
            // Создание препятствий
            if (Math.random() < 0.02) {
                createObstacle();
            }
            
            // Движение препятствий
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= speed;
                
                // Удаление препятствий за экраном
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    updateScore();
                }
                
                // Проверка столкновений
                if (checkCollision(player, obstacles[i])) {
                    gameOver();
                }
            }
        }
        
        // Проверка столкновений
        function checkCollision(player, obstacle) {
            return player.x < obstacle.x + obstacle.width &&
                   player.x + player.width > obstacle.x &&
                   player.y < obstacle.y + obstacle.height &&
                   player.y + player.height > obstacle.y;
        }
        
        // Отрисовка игры
        function draw() {
            // Очистка canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Фон
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Земля
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Сохранение контекста для вращения куба
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            ctx.rotate(player.rotation * Math.PI / 180);
            
            // Куб (игрок)
            ctx.fillStyle = player.color;
            ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
            
            // Границы куба
            ctx.strokeStyle = '#00cc00';
            ctx.lineWidth = 2;
            ctx.strokeRect(-player.width / 2, -player.height / 2, player.width, player.height);
            
            ctx.restore();
            
            // Препятствия
            obstacles.forEach(obstacle => {
                ctx.fillStyle = obstacle.color;
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                
                // Шипы на препятствиях
                ctx.fillStyle = '#ff6666';
                const spikeWidth = 10;
                for (let i = 0; i < obstacle.width; i += spikeWidth) {
                    ctx.beginPath();
                    ctx.moveTo(obstacle.x + i, obstacle.y);
                    ctx.lineTo(obstacle.x + i + spikeWidth / 2, obstacle.y - 10);
                    ctx.lineTo(obstacle.x + i + spikeWidth, obstacle.y);
                    ctx.fill();
                }
            });
        }
        
        // Обновление счёта
        function updateScore() {
            document.getElementById('score').textContent = `Счёт: ${score}`;
        }
        
        // Игровой цикл
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Игра окончена
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Перезапуск игры
        function restartGame() {
            gameRunning = true;
            score = 0;
            speed = 5;
            player.y = 300;
            player.vy = 0;
            player.isJumping = false;
            player.rotation = 0;
            obstacles = [];
            document.getElementById('gameOver').style.display = 'none';
            updateScore();
        }
        
        // Запуск игры
        gameLoop();
    </script>
</body>
    </html>
