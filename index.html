<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniCraft - Браузерная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
            cursor: crosshair;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            z-index: 100;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 30px;
            pointer-events: none;
            z-index: 100;
        }
        
        #blockSelector {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            z-index: 100;
        }
        
        .block-option {
            width: 40px;
            height: 40px;
            border: 2px solid transparent;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }
        
        .block-option:hover {
            transform: scale(1.1);
            border-color: white;
        }
        
        .block-option.active {
            border-color: yellow;
            box-shadow: 0 0 10px yellow;
        }
    </style>
</head>
<body>
    <div id="info">
        🎮 WASD - движение | Пробел - прыжок | ЛКМ - ломать | ПКМ - ставить | 1-6 - выбор блока
    </div>
    <div id="crosshair">+</div>
    <div id="blockSelector"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============ ИНИЦИАЛИЗАЦИЯ ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 100);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // ============ ОСВЕЩЕНИЕ ============
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 500;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);
        
        // ============ БЛОКИ ============
        const blockTypes = {
            grass: { color: 0x7CB342, name: 'Трава' },
            dirt: { color: 0x795548, name: 'Земля' },
            stone: { color: 0x9E9E9E, name: 'Камень' },
            wood: { color: 0x8D6E63, name: 'Дерево' },
            sand: { color: 0xFDD835, name: 'Песок' },
            water: { color: 0x42A5F5, name: 'Вода' }
        };
        
        const blockMeshes = {};
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        
        Object.keys(blockTypes).forEach(type => {
            const material = new THREE.MeshStandardMaterial({ 
                color: blockTypes[type].color,
                roughness: 0.8,
                metalness: 0.1
            });
            const mesh = new THREE.Mesh(blockGeometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            blockMeshes[type] = mesh;
        });
        
        // ============ МИР ============
        const world = new Map();
        const worldSize = 40;
        const worldHeight = 20;
        
        function generateWorld() {
            // Простая генерация местности
            for (let x = -worldSize/2; x < worldSize/2; x++) {
                for (let z = -worldSize/2; z < worldSize/2; z++) {
                    const height = Math.floor(
                        Math.sin(x * 0.3) * 3 + 
                        Math.cos(z * 0.25) * 2 + 
                        8
                    );
                    
                    for (let y = 0; y <= height; y++) {
                        let blockType = 'stone';
                        if (y === height) {
                            blockType = 'grass';
                        } else if (y > height - 3) {
                            blockType = 'dirt';
                        }
                        
                        const pos = `${x},${y},${z}`;
                        const block = blockMeshes[blockType].clone();
                        block.position.set(x, y, z);
                        block.userData = { type: blockType, pos: [x, y, z] };
                        scene.add(block);
                        world.set(pos, block);
                    }
                }
            }
            
            // Добавляем деревья
            for (let i = 0; i < 15; i++) {
                const x = Math.floor(Math.random() * worldSize) - worldSize/2;
                const z = Math.floor(Math.random() * worldSize) - worldSize/2;
                
                for (let y = 8; y < 15; y++) {
                    if (getBlock(x, y, z)?.userData.type === 'grass') {
                        // Ствол
                        for (let h = 1; h <= 4; h++) {
                            placeBlock(x, y + h, z, 'wood', false);
                        }
                        // Листва
                        for (let dx = -2; dx <= 2; dx++) {
                            for (let dz = -2; dz <= 2; dz++) {
                                for (let dy = 3; dy <= 6; dy++) {
                                    if (Math.random() > 0.3) {
                                        placeBlock(x + dx, y + dy, z + dz, 'grass', false);
                                    }
                                }
                            }
                        }
                        break;
                    }
                }
            }
        }
        
        function getBlock(x, y, z) {
            const pos = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
            return world.get(pos);
        }
        
        function placeBlock(x, y, z, type, removeExisting = true) {
            const pos = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
            
            if (removeExisting && world.has(pos)) {
                const existingBlock = world.get(pos);
                scene.remove(existingBlock);
                world.delete(pos);
            }
            
            if (!world.has(pos)) {
                const block = blockMeshes[type].clone();
                block.position.set(Math.floor(x), Math.floor(y), Math.floor(z));
                block.userData = { type, pos: [Math.floor(x), Math.floor(y), Math.floor(z)] };
                scene.add(block);
                world.set(pos, block);
                return true;
            }
            return false;
        }
        
        function removeBlock(x, y, z) {
            const pos = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
            if (world.has(pos)) {
                scene.remove(world.get(pos));
                world.delete(pos);
                return true;
            }
            return false;
        }
        
        generateWorld();
        
        // ============ УПРАВЛЕНИЕ ============
        const player = {
            position: new THREE.Vector3(0, 15, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            onGround: false,
            selectedBlock: 'grass',
            yaw: 0,
            pitch: 0
        };
        
        const keys = {};
        let mouseDown = false;
        let rightMouseDown = false;
        
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            // Выбор блока
            if (e.key >= '1' && e.key <= '6') {
                const types = Object.keys(blockTypes);
                player.selectedBlock = types[parseInt(e.key) - 1];
                updateBlockSelector();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                player.yaw -= e.movementX * 0.002;
                player.pitch -= e.movementY * 0.002;
                player.pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, player.pitch));
            }
        });
        
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) mouseDown = true;
            if (e.button === 2) rightMouseDown = true;
        });
        
        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) mouseDown = false;
            if (e.button === 2) rightMouseDown = false;
        });
        
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        
        // ============ ИНТЕРФЕЙС ============
        function updateBlockSelector() {
            const selector = document.getElementById('blockSelector');
            selector.innerHTML = '';
            
            Object.keys(blockTypes).forEach(type => {
                const div = document.createElement('div');
                div.className = 'block-option';
                div.style.backgroundColor = '#' + blockTypes[type].color.toString(16).padStart(6, '0');
                div.title = blockTypes[type].name;
                
                if (type === player.selectedBlock) {
                    div.classList.add('active');
                }
                
                div.addEventListener('click', () => {
                    player.selectedBlock = type;
                    updateBlockSelector();
                });
                
                selector.appendChild(div);
            });
        }
        
        updateBlockSelector();
        
        // ============ ФИЗИКА И ЛОГИКА ============
        function raycast(distance = 10) {
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            
            const origin = camera.position.clone();
            const step = 0.1;
            
            for (let i = 0; i < distance / step; i++) {
                origin.add(direction.clone().multiplyScalar(step));
                
                const x = Math.floor(origin.x);
                const y = Math.floor(origin.y);
                const z = Math.floor(origin.z);
                
                if (getBlock(x, y, z)) {
                    return { x, y, z, block: getBlock(x, y, z) };
                }
            }
            
            return null;
        }
        
        function checkCollision(position) {
            const size = 0.3; // Радиус игрока
            const height = 1.8; // Высота игрока
            
            for (let x = -1; x <= 1; x++) {
                for (let y = 0; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const blockX = Math.floor(position.x + x * size);
                        const blockY = Math.floor(position.y + y * height);
                        const blockZ = Math.floor(position.z + z * size);
                        
                        if (getBlock(blockX, blockY, blockZ)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }
        
        function updatePlayer(deltaTime) {
            // Направление движения
            const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
            const right = new THREE.Vector3(forward.z, 0, -forward.x);
            
            const moveSpeed = 5;
            const jumpForce = 8;
            const gravity = 20;
            
            let moveX = 0;
            let moveZ = 0;
            
            if (keys['KeyW']) {
                moveX += forward.x;
                moveZ += forward.z;
            }
            if (keys['KeyS']) {
                moveX -= forward.x;
                moveZ -= forward.z;
            }
            if (keys['KeyA']) {
                moveX -= right.x;
                moveZ -= right.z;
            }
            if (keys['KeyD']) {
                moveX += right.x;
                moveZ += right.z;
            }
            
            // Нормализация движения
            const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (length > 0) {
                moveX = moveX / length * moveSpeed;
                moveZ = moveZ / length * moveSpeed;
            }
            
            // Прыжок
            if (keys['Space'] && player.onGround) {
                player.velocity.y = jumpForce;
                player.onGround = false;
            }
            
            // Гравитация
            player.velocity.y -= gravity * deltaTime;
            
            // Перемещение
            player.position.x += moveX * deltaTime;
            player.position.z += moveZ * deltaTime;
            player.position.y += player.velocity.y * deltaTime;
            
            // Проверка коллизий
            if (checkCollision(player.position)) {
                player.position.x -= moveX * deltaTime;
                player.position.z -= moveZ * deltaTime;
                
                if (checkCollision(player.position)) {
                    player.position.x += moveX * deltaTime;
                    player.position.z += moveZ * deltaTime;
                }
            }
            
            // Проверка земли
            player.onGround = false;
            for (let y = 0; y >= -1; y--) {
                const blockX = Math.floor(player.position.x);
                const blockY = Math.floor(player.position.y + y);
                const blockZ = Math.floor(player.position.z);
                
                if (getBlock(blockX, blockY, blockZ)) {
                    player.position.y = blockY + 1;
                    player.velocity.y = 0;
                    player.onGround = true;
                    break;
                }
            }
            
            // Ограничение мира
            player.position.x = Math.max(-worldSize/2 + 1, Math.min(worldSize/2 - 1, player.position.x));
            player.position.z = Math.max(-worldSize/2 + 1, Math.min(worldSize/2 - 1, player.position.z));
            player.position.y = Math.max(1, Math.min(worldHeight + 10, player.position.y));
            
            // Обновление камеры
            camera.position.copy(player.position);
            camera.position.y += 1.7; // Высота глаз
            
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
        }
        
        function handleBlockInteraction() {
            const target = raycast(8);
            if (!target) return;
            
            if (mouseDown) {
                removeBlock(target.x, target.y, target.z);
                mouseDown = false;
            }
            
            if (rightMouseDown) {
                // Направление взгляда
                const direction = new THREE.Vector3(0, 0, -1);
                direction.applyQuaternion(camera.quaternion);
                
                // Размещаем блок рядом с тем, на который смотрим
                const placePos = {
                    x: target.x + Math.round(direction.x),
                    y: target.y + Math.round(direction.y),
                    z: target.z + Math.round(direction.z)
                };
                
                // Не размещаем блок внутри игрока
                const playerBlockPos = {
                    x: Math.floor(player.position.x),
                    y: Math.floor(player.position.y),
                    z: Math.floor(player.position.z)
                };
                
                if (placePos.x !== playerBlockPos.x || 
                    placePos.y !== playerBlockPos.y || 
                    placePos.z !== playerBlockPos.z) {
                    placeBlock(placePos.x, placePos.y, placePos.z, player.selectedBlock);
                }
                
                rightMouseDown = false;
            }
        }
        
        // ============ АНИМАЦИЯ ============
        let lastTime = 0;
        
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            updatePlayer(deltaTime);
            handleBlockInteraction();
            
            renderer.render(scene, camera);
        }
        
        // ============ АДАПТИВНОСТЬ ============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ============ ЗАПУСК ============
        animate(0);
        
        console.log('🎮 MiniCraft запущен!');
        console.log('Управление: WASD - движение, Пробел - прыжок, ЛКМ - ломать, ПКМ - ставить');
    </script>
</body>
</html>
