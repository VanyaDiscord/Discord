<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MiniCraft - Исправленная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        canvas {
            display: block;
        }
        
        #topBar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        
        #menuButton {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #healthBar, #hungerBar {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            gap: 5px;
            align-items: center;
        }
        
        .heart, .hunger {
            font-size: 20px;
        }
        
        .heart {
            color: #ff0000;
        }
        
        .hunger {
            color: #ff9800;
        }
        
        #hotbar {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 15px;
            z-index: 100;
        }
        
        .hotbar-slot {
            width: 50px;
            height: 50px;
            border: 3px solid #555;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .hotbar-slot.active {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        .item-count {
            position: absolute;
            bottom: 2px;
            right: 5px;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }
        
        #mobileControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            pointer-events: none;
        }
        
        .control-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
            align-items: center;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.9);
        }
        
        #jumpBtn {
            width: 70px;
            height: 70px;
            font-size: 30px;
            background: rgba(76, 175, 80, 0.5);
        }
        
        #cameraControl {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 120px;
            z-index: 100;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            touch-action: none;
        }
        
        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #fff;
            border-radius: 20px;
            padding: 30px;
            z-index: 1000;
            display: none;
            min-width: 300px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .menu.active {
            display: block;
        }
        
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #444;
            color: white;
            border: 2px solid #666;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .menu-btn:hover {
            background: #666;
            transform: translateX(5px);
        }
        
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #444;
        }
        
        .settings-label {
            color: white;
            font-size: 18px;
        }
        
        .settings-value {
            color: #ffd700;
            font-size: 16px;
            cursor: pointer;
            padding: 10px;
            background: #333;
            border-radius: 5px;
            min-width: 120px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .settings-value:hover {
            background: #555;
        }
        
        #inventory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #fff;
            border-radius: 20px;
            padding: 20px;
            z-index: 1002;
            display: none;
            min-width: 500px;
        }
        
        #inventory.active {
            display: block;
        }
        
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 20px;
        }
        
        .inventory-slot {
            width: 60px;
            height: 60px;
            border: 2px solid #555;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
            position: relative;
        }
        
        .inventory-slot:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }
        
        #craftingTable {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            z-index: 1003;
            display: none;
            min-width: 600px;
        }
        
        #craftingTable.active {
            display: block;
        }
        
        .crafting-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .crafting-slot {
            width: 70px;
            height: 70px;
            border: 2px solid #555;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            background: rgba(255, 255, 255, 0.05);
        }
        
        #craftResult {
            width: 70px;
            height: 70px;
            border: 3px solid #ffd700;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            background: rgba(255, 215, 0, 0.2);
            cursor: pointer;
            margin-left: 20px;
        }
        
        #furnaceMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ff9800;
            border-radius: 20px;
            padding: 20px;
            z-index: 1004;
            display: none;
            min-width: 400px;
        }
        
        #furnaceMenu.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            #hotbar {
                bottom: 170px;
            }
            
            .hotbar-slot {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
            
            #inventory, #craftingTable {
                min-width: 90vw;
            }
            
            .inventory-slot {
                width: 50px;
                height: 50px;
                font-size: 25px;
            }
            
            .crafting-slot {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="topBar">
        <button id="menuButton">☰ Меню</button>
        <div style="display: flex; gap: 10px;">
            <div id="hungerBar"></div>
            <div id="healthBar"></div>
        </div>
    </div>
    
    <div id="hotbar"></div>
    
    <div id="mobileControls">
        <div class="control-group">
            <button class="control-btn" id="leftBtn">◀</button>
            <button class="control-btn" id="rightBtn">▶</button>
            <button class="control-btn" id="upBtn">▲</button>
            <button class="control-btn" id="downBtn">▼</button>
        </div>
        <div class="control-group">
            <button class="control-btn" id="actionBtn">⛏️</button>
            <button class="control-btn" id="placeBtn">🏗️</button>
            <button class="control-btn" id="inventoryBtn">📦</button>
            <button class="control-btn" id="jumpBtn">⬆</button>
        </div>
    </div>
    
    <div id="cameraControl"></div>
    
    <div class="menu" id="mainMenu">
        <h2 style="color: white; text-align: center; margin-bottom: 20px;">🎮 MiniCraft</h2>
        <button class="menu-btn" id="continueBtn">▶ Продолжить</button>
        <button class="menu-btn" id="settingsBtn">⚙ Настройки</button>
        <button class="menu-btn" id="exitBtn">🚪 Выйти из игры</button>
    </div>
    
    <div class="menu" id="settingsMenu">
        <h2 style="color: white; text-align: center; margin-bottom: 20px;">⚙ Настройки</h2>
        <div class="settings-row">
            <span class="settings-label">Режим:</span>
            <span class="settings-value" id="gameModeValue">Выживание</span>
        </div>
        <div class="settings-row">
            <span class="settings-label">Сложность:</span>
            <span class="settings-value" id="difficultyValue">Лёгкая</span>
        </div>
        <button class="menu-btn" id="backToMenuBtn">◀ Назад</button>
    </div>
    
    <div class="menu" id="modeMenu">
        <h2 style="color: white; text-align: center; margin-bottom: 20px;">Выбор режима</h2>
        <button class="menu-btn mode-btn" data-mode="survival">🏃 Выживание</button>
        <button class="menu-btn mode-btn" data-mode="creative">🎨 Креатив</button>
        <button class="menu-btn" id="backToSettingsBtn">◀ Назад</button>
    </div>
    
    <div class="menu" id="difficultyMenu">
        <h2 style="color: white; text-align: center; margin-bottom: 20px;">Сложность</h2>
        <button class="menu-btn difficulty-btn" data-difficulty="peaceful">😊 Мирная</button>
        <button class="menu-btn difficulty-btn" data-difficulty="easy">🙂 Лёгкая</button>
        <button class="menu-btn difficulty-btn" data-difficulty="hard">😈 Сложная</button>
        <button class="menu-btn" id="backToSettingsFromDiffBtn">◀ Назад</button>
    </div>
    
    <div id="inventory">
        <h2 style="color: white; text-align: center; margin-bottom: 20px;">📦 Инвентарь</h2>
        <div class="inventory-grid" id="inventoryGrid"></div>
        <button class="menu-btn" id="closeInventoryBtn">Закрыть</button>
    </div>
    
    <div id="craftingTable">
        <h2 style="color: #ffd700; text-align: center; margin-bottom: 20px;">🔨 Верстак</h2>
        <div style="display: flex; justify-content: center; align-items: center;">
            <div class="crafting-grid" id="craftingGrid">
                <div class="crafting-slot" data-slot="0"></div>
                <div class="crafting-slot" data-slot="1"></div>
                <div class="crafting-slot" data-slot="2"></div>
                <div class="crafting-slot" data-slot="3"></div>
                <div class="crafting-slot" data-slot="4"></div>
                <div class="crafting-slot" data-slot="5"></div>
                <div class="crafting-slot" data-slot="6"></div>
                <div class="crafting-slot" data-slot="7"></div>
                <div class="crafting-slot" data-slot="8"></div>
            </div>
            <div id="craftResult">➡</div>
        </div>
        <button class="menu-btn" id="closeCraftingBtn">Закрыть</button>
    </div>
    
    <div id="furnaceMenu">
        <h2 style="color: #ff9800; text-align: center; margin-bottom: 20px;">🔥 Печь</h2>
        <div style="display: flex; justify-content: center; gap: 20px; padding: 20px;">
            <div>
                <p style="color: white; text-align: center;">Вход</p>
                <div class="inventory-slot" id="furnaceInput" style="width: 70px; height: 70px;">📦</div>
            </div>
            <div>
                <p style="color: white; text-align: center;">Топливо</p>
                <div class="inventory-slot" id="furnaceFuel" style="width: 70px; height: 70px;">🪵</div>
            </div>
            <div>
                <p style="color: white; text-align: center;">Выход</p>
                <div class="inventory-slot" id="furnaceOutput" style="width: 70px; height: 70px;">➡</div>
            </div>
        </div>
        <button class="menu-btn" id="closeFurnaceBtn">Закрыть</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============ ОПТИМИЗАЦИЯ ============
        const MAX_BLOCKS = 5000;
        
        // ============ ИНИЦИАЛИЗАЦИЯ ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 30, 20);
        
        const renderer = new THREE.WebGLRenderer({ 
            antialias: false,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);
        
        // ============ ОСВЕЩЕНИЕ ============
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(50, 100, 50);
        scene.add(directionalLight);
        
        // ============ БЛОКИ ============
        const blockTypes = {
            grass: { color: 0x7CB342, name: 'Трава', icon: '🌿', hardness: 1 },
            dirt: { color: 0x795548, name: 'Земля', icon: '🟫', hardness: 1 },
            stone: { color: 0x9E9E9E, name: 'Камень', icon: '🪨', hardness: 2 },
            wood: { color: 0x8D6E63, name: 'Дерево', icon: '🪵', hardness: 1 },
            sand: { color: 0xFDD835, name: 'Песок', icon: '🏖️', hardness: 1 },
            water: { color: 0x42A5F5, name: 'Вода', icon: '💧', hardness: 0 },
            leaves: { color: 0x4CAF50, name: 'Листья', icon: '🍃', hardness: 0.5 },
            glass: { color: 0xB3E5FC, name: 'Стекло', icon: '🔮', hardness: 0.3, transparent: true },
            brick: { color: 0xB71C1C, name: 'Кирпич', icon: '🧱', hardness: 2 },
            gold: { color: 0xFFD700, name: 'Золото', icon: '⭐', hardness: 3 },
            diamond: { color: 0x00E5FF, name: 'Алмаз', icon: '💎', hardness: 4 },
            obsidian: { color: 0x1A1A1A, name: 'Обсидиан', icon: '⬛', hardness: 5 },
            crafting_table: { color: 0xA1887F, name: 'Верстак', icon: '🔨', hardness: 2, functional: 'crafting' },
            furnace: { color: 0x616161, name: 'Печь', icon: '🔥', hardness: 2, functional: 'furnace' },
            chest: { color: 0xD4A574, name: 'Сундук', icon: '📦', hardness: 1.5, functional: 'chest' }
        };
        
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const blockMaterials = {};
        const blockMeshes = {};
        
        Object.keys(blockTypes).forEach(type => {
            const material = new THREE.MeshLambertMaterial({ 
                color: blockTypes[type].color,
                transparent: blockTypes[type].transparent || false,
                opacity: blockTypes[type].transparent ? 0.6 : 1
            });
            blockMaterials[type] = material;
            const mesh = new THREE.Mesh(blockGeometry, material);
            blockMeshes[type] = mesh;
        });
        
        // ============ ИГРОВОЕ СОСТОЯНИЕ ============
        const gameState = {
            mode: 'survival',
            difficulty: 'easy',
            paused: false,
            playerHealth: 20,
            playerHunger: 20
        };
        
        const inventory = {
            selectedSlot: 0,
            items: [
                { type: 'grass', count: 64 },
                { type: 'dirt', count: 64 },
                { type: 'stone', count: 64 },
                { type: 'wood', count: 32 },
                { type: 'sand', count: 32 },
                { type: 'crafting_table', count: 1 },
                { type: 'furnace', count: 1 },
                { type: 'chest', count: 1 },
                { type: 'brick', count: 16 },
                { type: 'glass', count: 16 },
                { type: 'gold', count: 8 },
                { type: 'diamond', count: 4 },
                { type: 'obsidian', count: 8 },
                null, null, null, null, null,
                null, null, null, null, null
            ]
        };
        
        // ============ МИР ============
        const world = new Map();
        const worldSize = 40;
        const worldHeight = 30;
        
        function generateWorld() {
            for (let x = -worldSize/2; x < worldSize/2; x++) {
                for (let z = -worldSize/2; z < worldSize/2; z++) {
                    const height = Math.floor(
                        Math.sin(x * 0.2) * 3 + 
                        Math.cos(z * 0.15) * 2 + 
                        Math.sin((x + z) * 0.1) * 2 +
                        10
                    );
                    
                    for (let y = 0; y <= height; y++) {
                        let blockType = 'stone';
                        if (y === height) {
                            blockType = Math.random() < 0.3 ? 'sand' : 'grass';
                        } else if (y > height - 3) {
                            blockType = 'dirt';
                        }
                        
                        if (y === height - 4 && Math.random() < 0.1) {
                            blockType = 'diamond';
                        } else if (y === height - 5 && Math.random() < 0.05) {
                            blockType = 'gold';
                        }
                        
                        placeBlock(x, y, z, blockType, false);
                    }
                }
            }
            
            // Деревья
            for (let i = 0; i < 25; i++) {
                const x = Math.floor(Math.random() * worldSize) - worldSize/2;
                const z = Math.floor(Math.random() * worldSize) - worldSize/2;
                const groundBlock = getBlock(x, 10, z);
                
                if (groundBlock && groundBlock.userData.type === 'grass') {
                    const treeHeight = 3 + Math.floor(Math.random() * 3);
                    for (let h = 1; h <= treeHeight; h++) {
                        placeBlock(x, groundBlock.position.y + h, z, 'wood', false);
                    }
                    
                    for (let dx = -2; dx <= 2; dx++) {
                        for (let dz = -2; dz <= 2; dz++) {
                            for (let dy = treeHeight - 1; dy <= treeHeight + 2; dy++) {
                                if (Math.random() < 0.6) {
                                    placeBlock(x + dx, groundBlock.position.y + dy, z + dz, 'leaves', false);
                                }
                            }
                        }
                    }
                }
            }
        }
        
        function getBlock(x, y, z) {
            const pos = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
            return world.get(pos);
        }
        
        function placeBlock(x, y, z, type, removeExisting = true) {
            const pos = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
            
            if (world.size > MAX_BLOCKS) return false;
            
            if (removeExisting && world.has(pos)) {
                const existingBlock = world.get(pos);
                scene.remove(existingBlock);
                world.delete(pos);
            }
            
            if (!world.has(pos)) {
                const block = blockMeshes[type].clone();
                block.position.set(Math.floor(x), Math.floor(y), Math.floor(z));
                block.userData = { type, pos: [Math.floor(x), Math.floor(y), Math.floor(z)] };
                scene.add(block);
                world.set(pos, block);
                return true;
            }
            return false;
        }
        
        function removeBlock(x, y, z) {
            const pos = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
            if (world.has(pos)) {
                const block = world.get(pos);
                scene.remove(block);
                world.delete(pos);
                
                const blockType = block.userData.type;
                if (gameState.mode === 'survival') {
                    addToInventory(blockType);
                }
                
                return true;
            }
            return false;
        }
        
        function addToInventory(type) {
            for (let i = 0; i < inventory.items.length; i++) {
                if (inventory.items[i] && inventory.items[i].type === type) {
                    inventory.items[i].count++;
                    updateInventoryUI();
                    return;
                }
            }
            
            for (let i = 0; i < inventory.items.length; i++) {
                if (inventory.items[i] === null) {
                    inventory.items[i] = { type, count: 1 };
                    updateInventoryUI();
                    return;
                }
            }
        }
        
        generateWorld();
        
        // ============ ИГРОК ============
        const player = {
            position: new THREE.Vector3(0, 15, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            onGround: false,
            yaw: 0,
            pitch: 0,
            health: 20,
            hunger: 20,
            fallStartY: 0
        };
        
        const keys = {};
        let isPointerLocked = false;
        let touchControls = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            jump: false
        };
        
        // ============ МОБЫ ============
        const mobs = [];
        
        class Mob {
            constructor(type, x, y, z) {
                this.type = type;
                this.mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 2, 1),
                    new THREE.MeshLambertMaterial({ color: type === 'zombie' ? 0x00FF00 : type === 'skeleton' ? 0xCCCCCC : 0x8B4513 })
                );
                this.mesh.position.set(x, y, z);
                this.mesh.userData = { mob: this };
                scene.add(this.mesh);
                
                this.health = type === 'zombie' ? 20 : type === 'skeleton' ? 15 : 10;
                this.speed = type === 'zombie' ? 1 : type === 'skeleton' ? 1.5 : 2;
                this.attackDamage = type === 'zombie' ? 3 : type === 'skeleton' ? 2 : 1;
                this.attackCooldown = 0;
                this.idleTimer = 0;
                this.direction = new THREE.Vector3();
            }
            
            update(deltaTime) {
                const distanceToPlayer = this.mesh.position.distanceTo(player.position);
                
                if (distanceToPlayer < 15 && distanceToPlayer > 2) {
                    const direction = player.position.clone().sub(this.mesh.position).normalize();
                    this.mesh.position.x += direction.x * this.speed * deltaTime;
                    this.mesh.position.z += direction.z * this.speed * deltaTime;
                    this.mesh.position.y += direction.y * this.speed * deltaTime;
                } else if (distanceToPlayer <= 2 && this.attackCooldown <= 0) {
                    player.health -= this.attackDamage;
                    this.attackCooldown = 2;
                    
                    if (player.health <= 0) {
                        playerDeath();
                    }
                    
                    updateHealthBar();
                } else {
                    this.idleTimer -= deltaTime;
                    if (this.idleTimer <= 0) {
                        this.idleTimer = Math.random() * 3 + 1;
                        this.direction.set(
                            Math.random() * 2 - 1,
                            0,
                            Math.random() * 2 - 1
                        ).normalize();
                    }
                    
                    this.mesh.position.x += this.direction.x * this.speed * 0.5 * deltaTime;
                    this.mesh.position.z += this.direction.z * this.speed * 0.5 * deltaTime;
                }
                
                if (this.attackCooldown > 0) {
                    this.attackCooldown -= deltaTime;
                }
                
                this.mesh.position.y -= 10 * deltaTime;
                
                const groundBlock = getBlock(
                    Math.floor(this.mesh.position.x),
                    Math.floor(this.mesh.position.y - 1),
                    Math.floor(this.mesh.position.z)
                );
                
                if (groundBlock) {
                    this.mesh.position.y = Math.floor(this.mesh.position.y);
                }
                
                if (this.health <= 0) {
                    scene.remove(this.mesh);
                    const index = mobs.indexOf(this);
                    if (index > -1) {
                        mobs.splice(index, 1);
                    }
                }
            }
            
            takeDamage(damage) {
                this.health -= damage;
            }
        }

        function raycast(distance = 10) {
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            
            const origin = camera.position.clone();
            const step = 0.1;
            
            for (let i = 0; i < distance / step; i++) {
                origin.add(direction.clone().multiplyScalar(step));
                
                const x = Math.floor(origin.x);
                const y = Math.floor(origin.y);
                const z = Math.floor(origin.z);
                
                if (getBlock(x, y, z)) {
                    return { x, y, z, block: getBlock(x, y, z) };
                }
            }
            
            return null;
        }
        
        function handleBlockBreak() {
            const target = raycast(8);
            if (!target) return;
            
            const blockType = target.block.userData.type;
            const hardness = blockTypes[blockType].hardness;
            
            if (gameState.mode === 'creative' || hardness === 0) {
                removeBlock(target.x, target.y, target.z);
            } else {
                setTimeout(() => {
                    if (getBlock(target.x, target.y, target.z)) {
                        removeBlock(target.x, target.y, target.z);
                    }
                }, hardness * 200);
            }
        }
        
        function handleBlockPlace() {
            const target = raycast(8);
            if (!target) return;
            
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            
            const placePos = {
                x: target.x + Math.round(direction.x),
                y: target.y + Math.round(direction.y),
                z: target.z + Math.round(direction.z)
            };
            
            const playerBlockPos = {
                x: Math.floor(player.position.x),
                y: Math.floor(player.position.y),
                z: Math.floor(player.position.z)
            };
            
            if (placePos.x !== playerBlockPos.x || 
                placePos.y !== playerBlockPos.y || 
                placePos.z !== playerBlockPos.z) {
                
                const selectedItem = inventory.items[inventory.selectedSlot];
                if (selectedItem && selectedItem.count > 0) {
                    if (placeBlock(placePos.x, placePos.y, placePos.z, selectedItem.type)) {
                        if (gameState.mode === 'survival') {
                            selectedItem.count--;
                            if (selectedItem.count <= 0) {
                                inventory.items[inventory.selectedSlot] = null;
                            }
                            updateInventoryUI();
                        }
                    }
                }
            }
        }
        
        function checkCollision(position) {
            const playerWidth = 0.6;
            const playerHeight = 1.8;
            
            // Проверяем блоки вокруг игрока
            for (let x = Math.floor(position.x - playerWidth/2); x <= Math.floor(position.x + playerWidth/2); x++) {
                for (let y = Math.floor(position.y); y <= Math.floor(position.y + playerHeight); y++) {
                    for (let z = Math.floor(position.z - playerWidth/2); z <= Math.floor(position.z + playerWidth/2); z++) {
                        if (getBlock(x, y, z)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }
        
        function updatePlayer(deltaTime) {
            const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
            const right = new THREE.Vector3(forward.z, 0, -forward.x);
            
            const moveSpeed = gameState.mode === 'creative' ? 8 : 5;
            const jumpForce = gameState.mode === 'creative' ? 12 : 8;
            const gravity = gameState.mode === 'creative' ? 15 : 25;
            
            let moveX = 0;
            let moveZ = 0;
            
            if (keys['KeyW'] || touchControls.forward) {
                moveX += forward.x;
                moveZ += forward.z;
            }
            if (keys['KeyS'] || touchControls.backward) {
                moveX -= forward.x;
                moveZ -= forward.z;
            }
            if (keys['KeyA'] || touchControls.left) {
                moveX -= right.x;
                moveZ -= right.z;
            }
            if (keys['KeyD'] || touchControls.right) {
                moveX += right.x;
                moveZ += right.z;
            }
            
            const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (length > 0) {
                moveX = moveX / length * moveSpeed;
                moveZ = moveZ / length * moveSpeed;
            }
            
            // Прыжок
            if ((keys['Space'] || touchControls.jump) && player.onGround) {
                player.velocity.y = jumpForce;
                player.onGround = false;
                player.fallStartY = player.position.y;
            }
            
            // Полет в креативе
            if (gameState.mode === 'creative') {
                if (keys['Space'] || touchControls.jump) {
                    player.velocity.y = jumpForce;
                }
                if (keys['ShiftLeft']) {
                    player.velocity.y = -jumpForce;
                }
            }
            
            // Гравитация
            player.velocity.y -= gravity * deltaTime;
            
            // Сохраняем старую позицию
            const oldPosition = player.position.clone();
            
            // Перемещение по X
            player.position.x += moveX * deltaTime;
            if (checkCollision(player.position)) {
                player.position.x = oldPosition.x;
            }
            
            // Перемещение по Z
            player.position.z += moveZ * deltaTime;
            if (checkCollision(player.position)) {
                player.position.z = oldPosition.z;
            }
            
            // Перемещение по Y
            player.position.y += player.velocity.y * deltaTime;
            
            // Проверка коллизии с землей
            player.onGround = false;
            const groundCheck = checkCollision(player.position);
            
            if (groundCheck) {
                // Определяем, падаем ли мы
                if (player.velocity.y < 0) {
                    // Урон от падения
                    const fallDistance = player.fallStartY - player.position.y;
                    if (fallDistance > 3 && gameState.mode === 'survival') {
                        const fallDamage = Math.floor(fallDistance - 3);
                        player.health -= fallDamage;
                        
                        if (player.health <= 0) {
                            playerDeath();
                        }
                        
                        updateHealthBar();
                    }
                    
                    player.velocity.y = 0;
                    player.onGround = true;
                    player.fallStartY = player.position.y;
                }
                
                // Откатываем позицию
                player.position.y = oldPosition.y;
            }
            
            // Ограничение мира
            player.position.x = Math.max(-worldSize/2 + 1, Math.min(worldSize/2 - 1, player.position.x));
            player.position.z = Math.max(-worldSize/2 + 1, Math.min(worldSize/2 - 1, player.position.z));
            player.position.y = Math.max(1, Math.min(worldHeight + 10, player.position.y));
            
            // Обновление камеры
            camera.position.copy(player.position);
            camera.position.y += 1.7;
            
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
            
            // Голод в выживании
            if (gameState.mode === 'survival' && gameState.difficulty !== 'peaceful') {
                const hungerRate = gameState.difficulty === 'easy' ? 0.01 : 0.02;
                player.hunger -= hungerRate * deltaTime;
                
                if (player.hunger <= 0) {
                    player.hunger = 0;
                    player.health -= 0.5 * deltaTime;
                    
                    if (player.health <= 0) {
                        playerDeath();
                    }
                    
                    updateHealthBar();
                }
            }
        }

                slot.textContent = item ? blockTypes[item.type].icon : '';
                
                slot.onclick = () => {
                    if (item) {
                        addToInventory(item.type);
                        craftingGrid.items[index] = null;
                        updateCraftingUI();
                    } else {
                        const selectedItem = inventory.items[inventory.selectedSlot];

                            updateCraftingUI();

                        }
                    }
                };
            });
            
            const result = checkCraftingRecipe();
            const resultSlot = document.getElementById('craftResult');
            
            if (result) {
                resultSlot.textContent = blockTypes[result.result].icon;
                resultSlot.onclick = () => {
                    for (let i = 0; i < result.count; i++) {
                        addToInventory(result.result);

        }
        
        function checkCraftingRecipe() {
            for (const recipeName in craftingRecipes) {
                const recipe = craftingRecipes[recipeName];
                const pattern = recipe.pattern;
                
                for (let row = 0; row <= 2; row++) {
                    for (let col = 0; col <= 2; col++) {
                        let matches = true;
                        
                        for (let i = 0; i < 3; i++) {
                            for (let j = 0; j < 3; j++) {
                                const gridIndex = (row + i) * 3 + (col + j);
                                if (gridIndex >= 9) {
                                    matches = false;
                                    break;
                                }
                                
                                const gridItem = craftingGrid.items[gridIndex];
                                const patternItem = pattern[i][j];
                                
                                if (patternItem === null && gridItem !== null) {
                                    matches = false;
                                    break;
                                }
                                
                                if (patternItem !== null && (!gridItem || gridItem.type !== patternItem)) {
                                    matches = false;
                                    break;
                                }
                            }
                            if (!matches) break;
                        }
                        
                        if (matches) {
                            return recipe;
                        }
                    }
                }
            }
            
            return null;
        }

            });
        });
        
        document.getElementById('backToSettingsFromDiffBtn').addEventListener('click', () => {
            difficultyMenu.classList.remove('active');
            settingsMenu.classList.add('active');
        });
        
        function updateSettingsDisplay() {
            document.getElementById('gameModeValue').textContent = 
                gameState.mode === 'survival' ? '🏃 Выживание' : '🎨 Креатив';
            document.getElementById('difficultyValue').textContent = 
                gameState.difficulty === 'peaceful' ? '😊 Мирная' : 
                gameState.difficulty === 'easy' ? '🙂 Лёгкая' : '😈 Сложная';
        }
        
        // ============ АНИМАЦИЯ ============
        let lastTime = 0;
        
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            if (!gameState.paused) {
                updatePlayer(deltaTime);
                updateMobs(deltaTime);
            }
            
            renderer.render(scene, camera);
        }
        
        // ============ АДАПТИВНОСТЬ ============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ============ ЗАПУСК ============
        updateHotbar();
        updateHealthBar();
        animate(0);
        
        console.log('🎮 MiniCraft запущен!');
        console.log('Режим:', gameState.mode);
        console.log('Сложность:', gameState.difficulty);
    </script>
</body>
    </html>
